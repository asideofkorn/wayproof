name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -v

      # The outcome check: rows added to data/ without a reading behind them.
      # Not a path check -- it does not care whether a row arrived through
      # ingest.py, a heredoc or an editor.
      - name: Provenance (every added row cites a reading)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin ${{ github.base_ref }}
          python scripts/check_provenance.py --base origin/${{ github.base_ref }}

      # Printed, never asserted. This is a measurement of how much of the
      # README's question list the tool can answer at all; a coverage number
      # that fails the build becomes a target, and the cheapest way to move
      # most rows is to add unchecked data. Read it in the log.
      - name: Scorecard (coverage of the README's questions)
        if: matrix.python-version == '3.12'
        run: python scripts/scorecard.py
