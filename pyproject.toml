[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wayproof"
version = "0.1.0"
description = "Source-backed outdoor trip logistics for Sierra Nevada objectives."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Chris Kornblatt" }]
keywords = ["sierra", "mountaineering", "hiking", "backpacking", "permits", "trip-planning", "public-lands"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/asideofkorn/wayproof"
Repository = "https://github.com/asideofkorn/wayproof"
Issues = "https://github.com/asideofkorn/wayproof/issues"

[project.scripts]
wayproof = "plan:main"
wayproof-sources = "cli:main"
wayproof-report = "report:main"

[tool.setuptools]
packages = ["wayproof"]
py-modules = ["cli", "plan", "report"]
